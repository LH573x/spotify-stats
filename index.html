<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lyra" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lyra</title>
  </head>
  <body>
    <!-- Abertura do app instalado: já vem no HTML, para aparecer antes do código carregar.
         O script decide se mostra (só no app instalado, uma vez por abertura) e o Splash.tsx a tira. -->
    <div id="splash" class="splash" hidden>
      <svg viewBox="9 2 15 28" class="splash-mark" aria-hidden="true">
        <path d="M20 5L16.8 10M16.8 10L12 14L13.9 27L18.2 23.3Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="20" cy="5" r="2.9" fill="currentColor" />
        <circle cx="16.8" cy="10" r="1.8" fill="currentColor" />
        <circle cx="12" cy="14" r="1.8" fill="currentColor" />
        <circle cx="13.9" cy="27" r="1.8" fill="currentColor" />
        <circle cx="18.2" cy="23.3" r="1.8" fill="currentColor" />
      </svg>
      <span class="splash-name">Lyra</span>
      <p class="splash-credit"><span id="splash-by">desenvolvido por</span><strong>Luiz Hong</strong></p>
    </div>
    <script>
      ;(function () {
        try {
          var force = /[?&]abertura\b/.test(location.search)
          var app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
          if (!force && (!app || sessionStorage.getItem('lyra-abertura'))) return
          sessionStorage.setItem('lyra-abertura', '1')
          var lang = localStorage.getItem('spotify-stats-lang')
          var by = { en: 'developed by', es: 'desarrollado por' }[lang]
          if (by) document.getElementById('splash-by').textContent = by
          document.getElementById('splash').hidden = false
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
